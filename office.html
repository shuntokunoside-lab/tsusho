<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>通所予定 変更の入力（スタッフ用）</title>
<style>body{max-width:640px;margin:0 auto;font-size:15px} .row{grid-template-columns:64px 1fr} .seg label{padding:7px 10px} input[type=text]{max-width:100%} .sub{margin:6px 0 0;flex-wrap:wrap}</style>
<style>
  body { font: 14px/1.5 "Hiragino Sans", "Noto Sans JP", Arial, sans-serif; color: #1f2933; margin: 0; padding: 10px 14px; }
  .row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; margin: 7px 0; }
  .row > b { font-size: 13px; }
  select, input[type=text], input[type=date] { font-size: 14px; padding: 5px 8px; border: 1px solid #ccd2d8; border-radius: 6px; background: #fff; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg label { border: 1px solid #ccd2d8; border-radius: 6px; padding: 4px 10px; cursor: pointer; user-select: none; }
  .seg input { display: none; }
  .seg input:checked + span { font-weight: 700; color: #fff; }
  .seg label:has(input:checked) { background: #2e7d5b; border-color: #2e7d5b; color: #fff; }
  .seg label.red:has(input:checked) { background: #c62828; border-color: #c62828; }
  .seg label.pur:has(input:checked) { background: #7e57c2; border-color: #7e57c2; }
  .sub { display: inline-flex; gap: 6px; align-items: center; margin-left: 6px; }
  .sub[hidden] { display: none; }
  .now { background: #f3f5f7; border-radius: 6px; padding: 6px 10px; font-size: 13px; margin: 4px 0 8px; }
  .btn { padding: 8px 18px; font-size: 14px; border-radius: 6px; border: 1px solid #2e7d5b; background: #2e7d5b; color: #fff; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .msg { margin-left: 10px; font-size: 13px; }
  .msg.err { color: #c62828; } .msg.ok { color: #2e7d5b; }
  h3 { font-size: 13px; margin: 14px 0 4px; color: #5f6b7a; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { border-bottom: 1px solid #eee; padding: 4px; vertical-align: top; }
  td.x { text-align: right; white-space: nowrap; }
  td.x button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccd2d8; border-radius: 4px; background: #fff; cursor: pointer; }
  .hint { color: #6b7480; font-size: 12px; }
</style>
</head>
<body>
  <h2 style="font-size:17px;margin:4px 0 8px">電話・連絡帳の変更を入れる</h2>
  <div class="row"><b>利用者</b><select id="user"></select></div>
  <div class="row"><b>日付</b><span><input type="date" id="date"> <span class="hint" id="dlabel"></span></span></div>
  <div class="now" id="now">今の予定：…</div>

  <div class="row"><b>受付</b>
    <span class="seg" id="via">
      <label><input type="radio" name="via" value="電話" checked><span>📞 電話</span></label>
      <label><input type="radio" name="via" value="連絡帳"><span>📒 連絡帳</span></label>
      <label><input type="radio" name="via" value="その他"><span>その他</span></label>
    </span>
  </div>
  <div class="row"><b>出欠</b>
    <span class="seg">
      <label><input type="radio" name="att" value="" checked><span>変更なし</span></label>
      <label class="red"><input type="radio" name="att" value="欠席"><span>欠席</span></label>
      <label><input type="radio" name="att" value="利用"><span>追加で利用</span></label>
    </span>
  </div>
  <div class="row"><b>行き</b>
    <span><span class="seg">
      <label><input type="radio" name="go" value="" checked><span>変更なし</span></label>
      <label><input type="radio" name="go" value="あり"><span>送迎あり</span></label>
      <label class="pur"><input type="radio" name="go" value="なし"><span>送迎なし</span></label>
    </span>
    <span class="sub" id="goSub" hidden><select id="goTime"></select><input type="text" id="goHow" maxlength="40" placeholder="方法（例：母が送る）" size="18"></span></span>
  </div>
  <div class="row"><b>帰り</b>
    <span><span class="seg">
      <label><input type="radio" name="back" value="" checked><span>変更なし</span></label>
      <label><input type="radio" name="back" value="あり"><span>送迎あり</span></label>
      <label class="pur"><input type="radio" name="back" value="なし"><span>送迎なし</span></label>
    </span>
    <span class="sub" id="backSub" hidden><select id="backTime"></select><input type="text" id="backHow" maxlength="40" placeholder="方法（例：母が迎え）" size="18"></span></span>
  </div>
  <div class="row"><b>入浴</b>
    <span><span class="seg">
      <label><input type="radio" name="bath" value="" checked><span>変更なし</span></label>
      <label><input type="radio" name="bath" value="追加"><span>入浴を追加</span></label>
    </span>
    <span class="sub" id="bathSub" hidden><select id="bathTime"></select></span></span>
  </div>
  <div class="row"><b>メモ</b><input type="text" id="memo" maxlength="80" placeholder="例：発熱のため／通院後13時ごろ来所"></div>
  <div class="row"><b>受けた人</b><input type="text" id="by" maxlength="20" placeholder="例：石井" style="width:140px"></div>
  <div><button class="btn" id="save">この内容で入れる</button><span class="msg" id="msg"></span></div>

  <h3 id="listTitle">この日に入っている変更</h3>
  <table id="list"></table>
  <p class="hint">入れた内容は、通所一覧（作り直すと）・現場配置表（10分以内に自動）・ご家族の画面（「施設で受付」）に出ます。</p>

<script>
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const radio = (n) => (document.querySelector('input[name="' + n + '"]:checked') || {}).value || '';
// スプレッドシートの中で開いたときは google.script.run、スマホのページ（office.html）では ウェブアプリのAPI を使う
const API_URL = 'https://script.google.com/macros/s/AKfycbyuacGQWf0fh0z9SIO1rECvI6jF8_6KpIBnCe91NtJUAIvlFQtdicjZZhSbXqNpeg/exec';
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const KEY = new URLSearchParams(location.search).get('k') || '';
async function request(url, opts) {
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch(url, Object.assign({ credentials: 'omit', redirect: 'follow', cache: 'no-store' }, opts));
      const j = await res.json();
      if (!j.ok) throw Object.assign(new Error(j.error || 'エラーが起きました'), { fromServer: true });
      return j.data;
    } catch (err) {
      if (err.fromServer) throw err;
      await new Promise((r) => setTimeout(r, 800 * (i + 1)));
    }
  }
  throw new Error('通信できませんでした。電波の良いところで、もう一度お試しください。');
}
function call(fn, ...a) {
  if (IN_GAS) return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng)[fn](...a));
  if (!KEY) return Promise.reject(new Error('このURLは使えません。事務用のQRコードから開いてください。'));
  const get = (q) => request(API_URL + '?' + Object.keys(q).map((k) => k + '=' + encodeURIComponent(q[k])).join('&'));
  if (fn === 'adminOfficeInit') return get({ api: 'oinit', k: KEY });
  if (fn === 'adminOfficeDay') return get({ api: 'oday', k: KEY, u: a[0], date: a[1] });
  if (fn === 'adminOfficeDelete') return get({ api: 'odel', k: KEY, id: a[0], u: a[1], date: a[2] });
  if (fn === 'adminOfficeSave') return request(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'osave', k: KEY, payload: a[0] }) });
  return Promise.reject(new Error('不明な操作です'));
}
// 受けた人の名前は、この端末で覚えておく
try { const b = localStorage.getItem('tsusho_by'); if (b) document.getElementById('by').value = b; } catch (e) {}
document.getElementById('by').addEventListener('input', (e) => { try { localStorage.setItem('tsusho_by', e.target.value); } catch (x) {} });
function times(sel, from, to, step, first) {
  sel.innerHTML = ''; sel.appendChild(new Option(first, ''));
  for (let m = from; m <= to; m += step) { const t = Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); sel.appendChild(new Option(t, t)); }
}
times($('goTime'), 8 * 60, 18 * 60, 15, '着く時間');
times($('backTime'), 8 * 60, 18 * 60, 15, 'お迎え時間');
times($('bathTime'), 9 * 60, 17 * 60, 30, '時間未定');
const toggleSubs = () => { $('goSub').hidden = radio('go') !== 'なし'; $('backSub').hidden = radio('back') !== 'なし'; $('bathSub').hidden = radio('bath') !== '追加'; };
document.querySelectorAll('input[type=radio]').forEach((r) => (r.onchange = toggleSubs));

function show(r) {
  $('dlabel').textContent = r.label;
  $('now').textContent = '今の予定：' + (r.now || '（利用者を選んでください）');
  $('listTitle').textContent = r.label + ' に入っている変更（' + r.list.length + '件）';
  const tb = $('list'); tb.innerHTML = '';
  r.list.forEach((x) => {
    const tr = el('tr');
    tr.appendChild(el('td', '', x.name));
    tr.appendChild(el('td', '', (x.via === '電話' ? '📞' : x.via === '連絡帳' ? '📒' : '') + x.text));
    tr.appendChild(el('td', '', x.at + (x.by ? ' ' + x.by : '')));
    const td = el('td', 'x'); const b = el('button', '', '取消');
    b.onclick = async () => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'もう一度押すと消えます'; return; }
      try { show(await call('adminOfficeDelete', x.id, $('user').value, $('date').value)); msg('取り消しました', 'ok'); } catch (e) { msg(e.message, 'err'); }
    };
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
}
function msg(t, k) { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (k || ''); }
async function refresh() {
  if (!$('date').value) return;
  try { show(await call('adminOfficeDay', $('user').value, $('date').value)); } catch (e) { msg(e.message, 'err'); }
}
$('user').onchange = refresh;
$('date').onchange = refresh;
$('save').onclick = async () => {
  $('save').disabled = true; msg('入れています…');
  try {
    const r = await call('adminOfficeSave', {
      userId: $('user').value, date: $('date').value, via: radio('via'), att: radio('att'),
      go: { mode: radio('go'), time: $('goTime').value, how: $('goHow').value },
      back: { mode: radio('back'), time: $('backTime').value, how: $('backHow').value },
      bath: radio('bath') === '追加', bathTime: $('bathTime').value,
      memo: $('memo').value, by: $('by').value,
    });
    show(r); msg('入れました', 'ok');
    // 次の入力のために、中身だけ戻す（利用者・日付・受けた人はそのまま）
    ['att', 'go', 'back', 'bath'].forEach((n) => (document.querySelector('input[name="' + n + '"][value=""]').checked = true));
    ['goHow', 'backHow', 'memo'].forEach((id) => ($(id).value = ''));
    toggleSubs();
  } catch (e) { msg(e.message, 'err'); }
  $('save').disabled = false;
};

call('adminOfficeInit').then((r) => {
  const sel = $('user');
  let g = null, og = null;
  r.users.forEach((u) => {
    if (u.group !== g) { g = u.group; og = document.createElement('optgroup'); og.label = g; sel.appendChild(og); }
    og.appendChild(new Option(u.name, u.id));
  });
  $('date').value = r.today;
  refresh();
}).catch((e) => msg(e.message, 'err'));
</script>
</body>
</html>
